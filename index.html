function escHtml(s){return s.replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’).replace(/”/g,’"’);}

function win(){
var segAngle=360/M.length;
var normDeg=((ang%360)+360)%360;
return Math.floor((360-normDeg)/segAngle)%M.length;
}

function spin(){
if(busy)return;cls();busy=true;
document.getElementById(‘spn’).disabled=true;
var dur=4000+Math.random()*2500;
var rot=360*(8+Math.random()*7);
var startAng=ang;
var t0=performance.now();
(function f(now){
var p=Math.min((now-t0)/dur,1);
ang=startAng+rot*(1-Math.pow(1-p,4));
setRotation(ang);
if(p<1)requestAnimationFrame(f);
else{busy=false;document.getElementById(‘spn’).disabled=false;show();}
})(t0);
}

var gif=data.data[0];var mp4=null,gifUrl=null;

} else if(gifUrl){

img.onerror=function(){showFB(mv,ga);};
} else showFB(mv,ga);
} else showFB(mv,ga);
