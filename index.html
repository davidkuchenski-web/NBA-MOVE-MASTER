<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NBA Move Master</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0a14;
  color: #fff;
  font-family: 'Oswald', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
}

h1 {
font-family: ‘Bangers’, cursive;
font-size: clamp(2rem, 8vw, 3.5rem);
color: #FFD700;
text-shadow: 0 0 30px rgba(255,215,0,.3), 0 2px 16px rgba(255,107,0,.5);
text-align: center;
margin-top: 16px;
letter-spacing: 3px;
}
.sub {
text-align: center;
font-size: clamp(.6rem, 2vw, .85rem);
color: rgba(255,255,255,.5);
letter-spacing: 5px;
text-transform: uppercase;
margin-bottom: 8px;
}

/* WHEEL AREA */
.wheel-area {
position: relative;
width: 84vw;
max-width: 440px;
margin: 0 auto;
}
/* Force square with padding trick */
.wheel-area::before {
content: ‘’;
display: block;
padding-bottom: 100%;
}

.wheel-svg {
position: absolute;
top: 0; left: 0;
width: 100%;
height: 100%;
border-radius: 50%;
}

.pointer {
position: absolute;
top: -10px;
left: 50%;
transform: translateX(-50%);
z-index: 10;
}

.hub-btn {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 60px; height: 60px;
border-radius: 50%;
border: 3px solid #FFD700;
background: radial-gradient(circle at 35% 35%, #ff8c00, #C8102E);
color: #fff;
font-family: ‘Bangers’, cursive;
font-size: .8rem;
letter-spacing: 2px;
cursor: pointer;
z-index: 10;
box-shadow: 0 0 20px rgba(255,107,0,.6);
display: flex;
align-items: center;
justify-content: center;
}

/* RESULT OVERLAY */
.result {
display: none;
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
z-index: 20;
flex-direction: column;
border-radius: 16px;
overflow: hidden;
background: linear-gradient(180deg, #0d0d1a, #111118, #0d0d1a);
border: 2px solid rgba(255,107,0,.3);
}
.result.show { display: flex; }
.result-top {
text-align: center;
padding: 12px 12px 4px;
background: linear-gradient(180deg, rgba(255,107,0,.12), transparent);
}
.result-player {
font-family: ‘Bangers’, cursive;
font-size: clamp(1.3rem, 4.5vw, 1.8rem);
color: #FFD700;
text-shadow: 0 2px 10px rgba(255,107,0,.4);
}
.result-move {
font-size: clamp(.6rem, 1.8vw, .8rem);
color: rgba(255,255,255,.6);
text-transform: uppercase;
letter-spacing: 3px;
margin-top: 2px;
}
.video-area {
flex: 1;
min-height: 0;
display: flex;
align-items: center;
justify-content: center;
padding: 6px 10px;
overflow: hidden;
}
.video-area iframe {
width: 100%; height: 100%;
border: 0; border-radius: 10px;
background: #000;
}
.video-area video, .video-area img {
max-width: 100%; max-height: 100%;
border-radius: 10px;
object-fit: contain;
}
.result-bottom {
padding: 6px 10px 10px;
text-align: center;
}
.challenge-label {
display: inline-block;
padding: 2px 10px;
background: #C8102E;
border-radius: 10px;
font-family: ‘Bangers’, cursive;
font-size: .55rem;
letter-spacing: 2px;
margin-bottom: 4px;
}
.challenge-desc {
font-size: clamp(.7rem, 1.8vw, .85rem);
color: rgba(255,255,255,.6);
line-height: 1.4;
margin-bottom: 4px;
}
.stars {
font-size: .75rem;
color: rgba(255,255,255,.35);
margin-bottom: 5px;
}
.stars .on { color: #FFD700; }
.btns { display: flex; gap: 5px; justify-content: center; }
.btns button {
padding: 7px 16px;
font-family: ‘Bangers’, cursive;
font-size: clamp(.8rem, 2.4vw, .95rem);
letter-spacing: 1.5px;
border: none;
border-radius: 18px;
cursor: pointer;
}
.btn-green { color: #111; background: linear-gradient(135deg, #00E676, #00C853); }
.btn-ghost { color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15) !important; }
.btn-gold { color: #111; background: linear-gradient(135deg, #FFD700, #FF6B00); }

/* SPIN BUTTON */
.spin-btn {
display: block;
margin: 10px auto 0;
padding: 14px 50px;
font-family: ‘Bangers’, cursive;
font-size: clamp(1rem, 4vw, 1.4rem);
letter-spacing: 4px;
color: #111;
background: linear-gradient(135deg, #FFD700, #FF6B00);
border: none;
border-radius: 30px;
cursor: pointer;
box-shadow: 0 4px 25px rgba(255,107,0,.4);
}
.spin-btn:disabled { opacity: .5; }

/* SCOREBOARD */
.score-bar {
display: flex;
gap: 20px;
justify-content: center;
margin-top: 12px;
padding: 8px 24px;
background: rgba(255,255,255,.04);
border-radius: 20px;
border: 1px solid rgba(255,215,0,.12);
}
.stat { display: flex; align-items: center; gap: 5px; }
.stat-label {
font-size: clamp(.6rem, 1.8vw, .75rem);
color: rgba(255,255,255,.5);
text-transform: uppercase;
letter-spacing: 2px;
font-weight: 700;
}
.stat-num {
font-family: ‘Bangers’, cursive;
font-size: clamp(1.1rem, 4vw, 1.5rem);
color: #FFD700;
text-shadow: 0 0 10px rgba(255,215,0,.3);
}

/* CONFETTI */
.confetti-box { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 100; }
.conf {
position: absolute;
top: -10px;
width: 8px; height: 8px;
animation: confFall linear forwards;
}
@keyframes confFall {
to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Loading bounce */
@keyframes bnc { from { transform: translateY(0); } to { transform: translateY(-8px); } }
.bounce { animation: bnc .6s ease-in-out infinite alternate; }
</style>

</head>

var teamColors = [
  '#C8102E','#1D428A','#552583','#007A33','#CE1141',
  '#006BB6','#F58426','#860038','#E56020','#00471B',
  '#1D1160','#236192','#EF3B24','#002D62','#FFC72C',
  '#00788C','#E31837','#002B5C','#F9A01B','#5D76A9'
];

// ==================== STATE ====================
var currentAngle = 0;
var spinning = false;
var score = 0;
var streak = 0;
var videoLoadId = 0;

// ==================== BUILD WHEEL ====================
function buildWheel() {
  var n = moves.length;
  var segDeg = 360 / n;
  var cx = 250, cy = 250, r = 240;
  var svgNS = 'http://www.w3.org/2000/svg';

  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 500 500');
  svg.setAttribute('class', 'wheel-svg');
  svg.id = 'wheelSvg';

  // Background
  var bg = document.createElementNS(svgNS, 'circle');
  bg.setAttribute('cx', cx);
  bg.setAttribute('cy', cy);
  bg.setAttribute('r', 250);
  bg.setAttribute('fill', '#08080e');
  svg.appendChild(bg);

  // Rim
  var rim = document.createElementNS(svgNS, 'circle');
  rim.setAttribute('cx', cx);
  rim.setAttribute('cy', cy);
  rim.setAttribute('r', 247);
  rim.setAttribute('fill', 'none');
  rim.setAttribute('stroke', 'rgba(255,107,0,0.35)');
  rim.setAttribute('stroke-width', '3');
  svg.appendChild(rim);

  // Segments
  for (var i = 0; i < n; i++) {
    var a1 = (i * segDeg - 90) * Math.PI / 180;
    var a2 = ((i + 1) * segDeg - 90) * Math.PI / 180;
    var x1 = cx + r * Math.cos(a1);
    var y1 = cy + r * Math.sin(a1);
    var x2 = cx + r * Math.cos(a2);
    var y2 = cy + r * Math.sin(a2);

    var path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d',
      'M' + cx + ',' + cy +
      ' L' + x1.toFixed(1) + ',' + y1.toFixed(1) +
      ' A' + r + ',' + r + ' 0 0,1 ' + x2.toFixed(1) + ',' + y2.toFixed(1) + ' Z'
    );
    path.setAttribute('fill', teamColors[i % teamColors.length]);
    path.setAttribute('stroke', 'rgba(0,0,0,0.3)');
    path.setAttribute('stroke-width', '0.5');
    svg.appendChild(path);

    // Label
    var labelAngle = (i * segDeg + segDeg / 2 - 90) * Math.PI / 180;
    var txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', cx + r - 10);
    txt.setAttribute('y', cy);
    txt.setAttribute('text-anchor', 'end');
    txt.setAttribute('dominant-baseline', 'central');
    txt.setAttribute('transform', 'rotate(' + (i * segDeg + segDeg / 2 - 90) + ',' + cx + ',' + cy + ')');
    txt.setAttribute('fill', '#fff');
    txt.setAttribute('font-family', 'Oswald, Arial Black, sans-serif');
    txt.setAttribute('font-weight', '700');
    txt.setAttribute('font-size', '11');
    txt.setAttribute('stroke', 'rgba(0,0,0,0.7)');
    txt.setAttribute('stroke-width', '2.5');
    txt.setAttribute('paint-order', 'stroke');
    txt.textContent = moves[i].ln;
    svg.appendChild(txt);
  }

  // Center circle
  var center = document.createElementNS(svgNS, 'circle');
  center.setAttribute('cx', cx);
  center.setAttribute('cy', cy);
  center.setAttribute('r', 35);
  center.setAttribute('fill', 'rgba(0,0,0,0.5)');
  svg.appendChild(center);

  // Insert as FIRST child of wheel-area (before pointer and hub)
  var area = document.getElementById('wheelArea');
  area.insertBefore(svg, area.firstChild);

  return svg;
}

// ==================== SPIN ====================
var wheelEl = null;

function doSpin() {
  if (spinning) return;
  closeResult();
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  if (!wheelEl) {
    wheelEl = document.getElementById('wheelSvg');
  }

  var duration = 4000 + Math.random() * 2500;
  var totalRotation = 360 * (8 + Math.random() * 7);
  var startAngle = currentAngle;
  var startTime = Date.now();

  function animate() {
    var elapsed = Date.now() - startTime;
    var progress = Math.min(elapsed / duration, 1);

    // Ease out quart
    var eased = 1 - Math.pow(1 - progress, 4);
    currentAngle = startAngle + totalRotation * eased;

    // Apply rotation via CSS transform on the SVG
    wheelEl.style.webkitTransform = 'rotate(' + currentAngle + 'deg)';
    wheelEl.style.transform = 'rotate(' + currentAngle + 'deg)';

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      showResult();
    }
  }

  requestAnimationFrame(animate);
}

// ==================== WINNER LOGIC ====================
function getWinner() {
  var segDeg = 360 / moves.length;
  var normalized = ((currentAngle % 360) + 360) % 360;
  var index = Math.floor((360 - normalized) / segDeg) % moves.length;
  return index;
}

// ==================== RESULT PANEL ====================
function showResult() {
  var mv = moves[getWinner()];
  document.getElementById('rPlayer').textContent = mv.p;
  document.getElementById('rMove').textContent = mv.m;
  document.getElementById('rDesc').textContent = mv.d;

  var starOn = '';
  var starOff = '';
  for (var i = 0; i < mv.s; i++) starOn += '\u2605';
  for (var j = mv.s; j < 5; j++) starOff += '\u2606';
  document.getElementById('rStars').innerHTML = 'Difficulty: <span class="on">' + starOn + '</span>' + starOff;

  var panel = document.getElementById('resultPanel');
  panel.classList.add('show');

  videoLoadId++;
  loadVideo(mv, document.getElementById('videoArea'), videoLoadId);
}

function closeResult() {
  videoLoadId++;
  var va = document.getElementById('videoArea');
  // Clean up iframes and videos
  var iframes = va.querySelectorAll('iframe');
  for (var i = 0; i < iframes.length; i++) {
    iframes[i].src = '';
    iframes[i].remove();
  }
  var vids = va.querySelectorAll('video');
  for (var j = 0; j < vids.length; j++) {
    vids[j].pause();
    vids[j].src = '';
    vids[j].remove();
  }
  va.innerHTML = '';
  document.getElementById('resultPanel').classList.remove('show');
}

function nailedIt() {
  score++;
  streak++;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('streakNum').textContent = streak;
  var si = document.getElementById('streakIcon');
  si.innerHTML = streak >= 5 ? '&#128293;&#128293;&#128293;' : streak >= 3 ? '&#128293;&#128293;' : '&#128293;';
  confetti();
  closeResult();
}

function nextSpin() {
  closeResult();
  setTimeout(doSpin, 350);
}

// ==================== VIDEO LOADING ====================
function loadVideo(mv, container, loadId) {
  container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,.25);font-size:.7rem;letter-spacing:2px"><div class="bounce" style="font-size:1.5rem;display:block;margin-bottom:4px">&#127936;</div>LOADING...</div>';

  if (mv.yt) {
    var ifr = document.createElement('iframe');
    ifr.src = 'https://www.youtube.com/embed/' + mv.yt + '?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1';
    ifr.allow = 'autoplay; encrypted-media';
    ifr.allowFullscreen = true;
    container.innerHTML = '';
    container.appendChild(ifr);
    return;
  }

  if (mv.tk) {
    var ifr2 = document.createElement('iframe');
    ifr2.src = 'https://www.tiktok.com/player/v1/' + mv.tk + '?music_info=0&description=0&autoplay=1&loop=1';
    ifr2.allow = 'autoplay';
    container.innerHTML = '';
    container.appendChild(ifr2);
    return;
  }

  // Giphy fallback
  var q = encodeURIComponent(mv.gq || mv.p + ' ' + mv.m);
  fetch('https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=' + q + '&limit=3&rating=g')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (videoLoadId !== loadId) return;
      if (data.data && data.data.length > 0) {
        var gif = data.data[0];
        var mp4 = null;
        var gifUrl = null;
        try { mp4 = gif.images.original.mp4; } catch(e) {}
        try { gifUrl = gif.images.fixed_height.url; } catch(e) {}
        if (!gifUrl) try { gifUrl = gif.images.original.url; } catch(e) {}

        if (mp4) {
          var vid = document.createElement('video');
          vid.autoplay = true;
          vid.loop = true;
          vid.muted = true;
          vid.playsInline = true;
          vid.setAttribute('playsinline', '');
          vid.src = mp4;
          vid.onloadeddata = function() {
            if (videoLoadId === loadId) {
              container.innerHTML = '';
              container.appendChild(vid);
              vid.play().catch(function() {});
            }
          };
          vid.onerror = function() {
            if (gifUrl && videoLoadId === loadId) {
              container.innerHTML = '';
              var img = new Image();
              img.src = gifUrl;
              container.appendChild(img);
            } else {
              showFallback(mv, container);
            }
          };
        } else if (gifUrl) {
          container.innerHTML = '';
          var img = new Image();
          img.src = gifUrl;
          container.appendChild(img);
        } else {
          showFallback(mv, container);
        }
      } else {
        showFallback(mv, container);
      }
    })
    .catch(function() {
      if (videoLoadId === loadId) showFallback(mv, container);
    });
}

function showFallback(mv, container) {
  container.innerHTML = '<div style="text-align:center;padding:20px">' +
    '<div class="bounce" style="font-size:4rem">&#127936;</div>' +
    '<div style="font-family:Bangers,cursive;font-size:1.3rem;color:#FFD700;margin-top:10px;letter-spacing:2px">' +
    mv.m.toUpperCase() + '</div>' +
    '<div style="color:rgba(255,255,255,.4);font-size:.7rem;margin-top:6px">SHOW US YOUR MOVE!</div></div>';
}

// ==================== CONFETTI ====================
function confetti() {
  var box = document.getElementById('confettiBox');
  var colors = ['#FF6B00','#FFD700','#C8102E','#1D428A','#00E676','#FF4081','#fff'];
  for (var i = 0; i < 45; i++) {
    var el = document.createElement('div');
    el.className = 'conf';
    el.style.left = Math.random() * 100 + '%';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 0.4 + 's';
    el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    var size = 5 + Math.random() * 7;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    box.appendChild(el);
    (function(e) { setTimeout(function() { e.remove(); }, 3000); })(el);
  }
}
