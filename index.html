<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0a14;
  color: #fff;
  font-family: -apple-system, 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
}
h1 {
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: clamp(2rem, 8vw, 3.5rem);
  color: #FFD700;
  text-shadow: 0 0 30px rgba(255,215,0,.3), 0 2px 16px rgba(255,107,0,.5);
  text-align: center;
  margin-top: 16px;
  letter-spacing: 3px;
}
.sub {
  text-align: center;
  font-size: clamp(.6rem, 2vw, .85rem);
  color: rgba(255,255,255,.5);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.wheel-box {
  position: relative;
  width: 84vw;
  max-width: 440px;
  margin: 0 auto;
}
.wheel-img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 50%;
  -webkit-transform: rotate(0deg);
  transform: rotate(0deg);
  will-change: transform;
}
.pointer {
  position: absolute;
  top: -10px;
  left: 50%;
  margin-left: -16px;
  z-index: 10;
  width: 32px;
  height: 28px;
}
.hub {
  position: absolute;
  top: 50%; left: 50%;
  width: 60px; height: 60px;
  margin: -30px 0 0 -30px;
  border-radius: 50%;
  border: 3px solid #FFD700;
  background: radial-gradient(circle at 35% 35%, #ff8c00, #C8102E);

  font-family: Impact, 'Arial Black', sans-serif;
  font-size: .75rem;
  letter-spacing: 2px;
  cursor: pointer;
  z-index: 10;
  box-shadow: 0 0 20px rgba(255,107,0,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-appearance: none;
}
.result-panel {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 20;
  flex-direction: column;
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(180deg, #0d0d1a, #111118, #0d0d1a);
  border: 2px solid rgba(255,107,0,.3);
}
.result-panel.show { display: flex; }
.r-top {
  text-align: center;
  padding: 12px 12px 4px;

.r-player {

  text-shadow: 0 2px 10px rgba(255,107,0,.4);
}
.r-move {
  font-size: clamp(.6rem, 1.8vw, .8rem);
  color: rgba(255,255,255,.6);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-top: 2px;
}
.vid-area {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 6px 10px; overflow: hidden;
}
.vid-area iframe { width:100%; height:100%; border:0; border-radius:10px; background:#000; }
.vid-area video, .vid-area img { max-width:100%; max-height:100%; border-radius:10px; object-fit:contain; }
.r-bot { padding: 6px 10px 10px; text-align: center; }
.ch-label {
  display: inline-block; padding: 2px 10px; background: #C8102E;
  border-radius: 10px; font-size: .55rem; letter-spacing: 2px; margin-bottom: 4px;
  font-family: Impact, 'Arial Black', sans-serif;

.ch-desc { font-size: clamp(.7rem,1.8vw,.85rem); color: rgba(255,255,255,.6); line-height:1.4; margin-bottom:4px; }
.ch-stars { font-size:.75rem; color:rgba(255,255,255,.35); margin-bottom:5px; }
.ch-stars .on { color:#FFD700; }
.btns { display:flex; gap:5px; justify-content:center; }
.btns button {
  padding:7px 16px; font-family:Impact,'Arial Black',sans-serif;
  font-size:clamp(.8rem,2.4vw,.95rem); letter-spacing:1.5px;
  border:none; border-radius:18px; cursor:pointer;

.btn-g { color:#111; background:linear-gradient(135deg,#00E676,#00C853); }
.btn-o { color:#fff; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15)!important; }
.btn-y { color:#111; background:linear-gradient(135deg,#FFD700,#FF6B00); }
.spin-btn {
  display:block; margin:10px auto 0; padding:14px 50px;
  font-family:Impact,'Arial Black',sans-serif; font-size:clamp(1rem,4vw,1.4rem);
  letter-spacing:4px; color:#111; background:linear-gradient(135deg,#FFD700,#FF6B00);
  border:none; border-radius:30px; cursor:pointer; box-shadow:0 4px 25px rgba(255,107,0,.4);

.spin-btn:disabled { opacity:.5; }
.score-bar {

.cbox { position:fixed; top:0; left:0; width:100%; pointer-events:none; z-index:100; }

@keyframes cfall { to { transform:translateY(100vh) rotate(720deg); opacity:0; } }
@keyframes bnc { from{transform:translateY(0)} to{transform:translateY(-8px)} }

var colors=['#C8102E','#1D428A','#552583','#007A33','#CE1141','#006BB6','#F58426','#860038','#E56020','#00471B','#1D1160','#236192','#EF3B24','#002D62','#FFC72C','#00788C','#E31837','#002B5C','#F9A01B','#5D76A9'];

// ===== BUILD SVG AS DATA URI IMG =====
function makeWheelImg() {
  var n = moves.length;
  var seg = 360 / n;
  var cx = 250, cy = 250, r = 240;
  var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">';
  s += '<circle cx="250" cy="250" r="250" fill="#08080e"/>';
  s += '<circle cx="250" cy="250" r="247" fill="none" stroke="rgba(255,107,0,0.35)" stroke-width="3"/>';

  for (var i = 0; i < n; i++) {
    var a1 = (i * seg - 90) * Math.PI / 180;
    var a2 = ((i+1) * seg - 90) * Math.PI / 180;
    var x1 = cx + r * Math.cos(a1);
    var y1 = cy + r * Math.sin(a1);
    var x2 = cx + r * Math.cos(a2);
    var y2 = cy + r * Math.sin(a2);
    s += '<path d="M250,250 L' + x1.toFixed(1) + ',' + y1.toFixed(1) +
         ' A240,240 0 0,1 ' + x2.toFixed(1) + ',' + y2.toFixed(1) +
         ' Z" fill="' + colors[i % colors.length] + '" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>';
  }

  for (var i = 0; i < n; i++) {
    var rot = i * seg + seg / 2 - 90;
    var label = moves[i].ln.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s += '<text x="480" y="250" text-anchor="end" dominant-baseline="central" ' +
         'transform="rotate(' + rot.toFixed(1) + ',250,250)" ' +
         'fill="white" font-family="Arial Black,Impact,sans-serif" font-weight="bold" font-size="11" ' +
         'stroke="black" stroke-width="2.5" paint-order="stroke">' + label + '</text>';
  }

  s += '<circle cx="250" cy="250" r="35" fill="rgba(0,0,0,0.5)"/>';
  s += '</svg>';

  // Create img with data URI
  var img = document.createElement('img');
  img.className = 'wheel-img';
  img.id = 'wheelImg';
  img.alt = 'Spin Wheel';
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

  var box = document.getElementById('wheelBox');
  box.insertBefore(img, box.firstChild);
  return img;
}

// ===== STATE =====
var angle = 0;
var busy = false;
var score = 0;
var streak = 0;
var vLoadId = 0;
var wheelImg = null;

// ===== SPIN =====
function doSpin() {
  if (busy) return;
  closeR();
  busy = true;
  document.getElementById('spinBtn').disabled = true;

  if (!wheelImg) wheelImg = document.getElementById('wheelImg');

  var duration = 4000 + Math.random() * 2500;
  var totalRot = 360 * (8 + Math.random() * 7);
  var start = angle;
  var t0 = Date.now();

  function tick() {
    var elapsed = Date.now() - t0;
    var p = Math.min(elapsed / duration, 1);
    var ease = 1 - Math.pow(1 - p, 4);
    angle = start + totalRot * ease;

    wheelImg.style.cssText = '-webkit-transform:rotate(' + angle + 'deg);transform:rotate(' + angle + 'deg);display:block;width:100%;height:auto;border-radius:50%;will-change:transform;';

    if (p < 1) {
      requestAnimationFrame(tick);
    } else {
      busy = false;
      document.getElementById('spinBtn').disabled = false;
      showR();
    }
  }
  requestAnimationFrame(tick);
}

// ===== WINNER =====
function getWin() {
  var seg = 360 / moves.length;
  var norm = ((angle % 360) + 360) % 360;
  return Math.floor((360 - norm) / seg) % moves.length;
}

// ===== RESULT =====
function showR() {
  var mv = moves[getWin()];
  document.getElementById('rPlayer').textContent = mv.p;
  document.getElementById('rMove').textContent = mv.m;
  document.getElementById('rDesc').textContent = mv.d;
  var on = '', off = '';
  for (var i = 0; i < mv.s; i++) on += '\u2605';
  for (var i = mv.s; i < 5; i++) off += '\u2606';
  document.getElementById('rStars').innerHTML = 'Difficulty: <span class="on">' + on + '</span>' + off;
  document.getElementById('rPanel').classList.add('show');
  vLoadId++;
  loadVid(mv, document.getElementById('vidArea'), vLoadId);
}

function closeR() {
  vLoadId++;
  var va = document.getElementById('vidArea');
  var ifs = va.querySelectorAll('iframe');
  for (var i = 0; i < ifs.length; i++) { ifs[i].src = ''; ifs[i].remove(); }
  var vs = va.querySelectorAll('video');
  for (var i = 0; i < vs.length; i++) { vs[i].pause(); vs[i].src = ''; vs[i].remove(); }
  va.innerHTML = '';
  document.getElementById('rPanel').classList.remove('show');
}

function nailed() {
  score++; streak++;
  document.getElementById('sNum').textContent = score;
  document.getElementById('kNum').textContent = streak;
  document.getElementById('kI').innerHTML = streak >= 5 ? '&#128293;&#128293;&#128293;' : streak >= 3 ? '&#128293;&#128293;' : '&#128293;';
  confetti();
  closeR();
}

function nextS() { closeR(); setTimeout(doSpin, 350); }

// ===== VIDEO =====
function loadVid(mv, box, lid) {
  box.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,.25);font-size:.7rem;letter-spacing:2px"><div style="font-size:1.5rem;margin-bottom:4px;animation:bnc .6s ease-in-out infinite alternate">&#127936;</div>LOADING...</div>';
  if (mv.yt) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + mv.yt + '?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1';
    f.allow = 'autoplay; encrypted-media';
    f.allowFullscreen = true;
    box.innerHTML = ''; box.appendChild(f); return;
  }
  if (mv.tk) {
    var f2 = document.createElement('iframe');
    f2.src = 'https://www.tiktok.com/player/v1/' + mv.tk + '?music_info=0&description=0&autoplay=1&loop=1';
    f2.allow = 'autoplay';
    box.innerHTML = ''; box.appendChild(f2); return;
  }
  loadGif(mv, box, lid);
}

function loadGif(mv, box, lid) {
  var q = encodeURIComponent(mv.gq || mv.p + ' ' + mv.m);
  fetch('https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=' + q + '&limit=3&rating=g')
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (vLoadId !== lid) return;
    if (d.data && d.data.length > 0) {
      var g = d.data[0], mp4 = null, url = null;
      try { mp4 = g.images.original.mp4; } catch(e) {}
      try { url = g.images.fixed_height.url; } catch(e) {}
      if (!url) try { url = g.images.original.url; } catch(e) {}
      if (mp4) {
        var v = document.createElement('video');
        v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
        v.setAttribute('playsinline',''); v.src = mp4;
        v.onloadeddata = function() { if (vLoadId === lid) { box.innerHTML = ''; box.appendChild(v); v.play().catch(function(){}); } };
        v.onerror = function() { if (url) { box.innerHTML = ''; var im = new Image(); im.src = url; box.appendChild(im); } else fb(mv,box); };
      } else if (url) { box.innerHTML = ''; var im = new Image(); im.src = url; box.appendChild(im); }
      else fb(mv, box);
    } else fb(mv, box);
  }).catch(function() { if (vLoadId === lid) fb(mv, box); });
}

function fb(mv, box) {
  box.innerHTML = '<div style="text-align:center;padding:20px"><div style="font-size:4rem;animation:bnc .6s ease-in-out infinite alternate">&#127936;</div><div style="font-family:Impact,sans-serif;font-size:1.3rem;color:#FFD700;margin-top:10px;letter-spacing:2px">' + mv.m.toUpperCase() + '</div><div style="color:rgba(255,255,255,.4);font-size:.7rem;margin-top:6px">SHOW US YOUR MOVE!</div></div>';
}

// ===== CONFETTI =====
function confetti() {
  var b = document.getElementById('cbox');
  var cc = ['#FF6B00','#FFD700','#C8102E','#1D428A','#00E676','#FF4081','#fff'];
  for (var i = 0; i < 45; i++) {
    var e = document.createElement('div'); e.className = 'cpiece';
    e.style.left = Math.random()*100 + '%';
    e.style.backgroundColor = cc[Math.floor(Math.random()*cc.length)];
    e.style.animationDelay = Math.random()*.4 + 's';
    e.style.animationDuration = (2+Math.random()*1.5) + 's';
    var sz = 5 + Math.random()*7;
    e.style.width = sz+'px'; e.style.height = sz+'px';
    e.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
    b.appendChild(e);
    (function(el) { setTimeout(function() { el.remove(); }, 3000); })(e);
  }
}

wheelImg = makeWheelImg();
