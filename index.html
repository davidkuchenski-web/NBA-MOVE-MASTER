<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NBA Move Master</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bangers&display=swap');

:root {
–orange: #FF6B00;
–dark: #111118;
–darker: #08080e;
–gold: #FFD700;
–red: #C8102E;
}

- { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
background: var(–dark);
color: #fff;
font-family: ‘Oswald’, ‘Arial Black’, sans-serif;
overflow-x: hidden;
min-height: 100vh;
-webkit-tap-highlight-color: transparent;
}

.hdr {
text-align: center;
padding: 20px 16px 6px;
}

.hdr h1 {
font-family: ‘Bangers’, ‘Impact’, sans-serif;
font-size: clamp(2rem, 8vw, 3.5rem);
letter-spacing: 3px;
color: var(–gold);
text-shadow: 0 2px 16px rgba(255,107,0,0.5);
line-height: 1;
}

.hdr .sub {
font-size: clamp(0.6rem, 2vw, 0.85rem);
color: rgba(255,255,255,0.3);
letter-spacing: 5px;
text-transform: uppercase;
margin-top: 2px;
}

.game {
display: flex;
flex-direction: column;
align-items: center;
padding: 8px 16px 16px;
}

/* === WHEEL === */
.wheel-zone {
position: relative;
width: min(84vw, 440px);
aspect-ratio: 1;
margin: 6px auto;
}

.glow-ring {
position: absolute;
inset: -12px;
border-radius: 50%;
background: conic-gradient(from 0deg, var(–orange), var(–gold), var(–orange), var(–red), var(–orange));
opacity: 0.45;
filter: blur(2px);
animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
0%,100% { opacity: 0.3; }
50% { opacity: 0.55; }
}

.wheel-bg {
position: absolute;
inset: 2px;
border-radius: 50%;
background: var(–darker);
}

canvas {
position: absolute;
inset: 4px;
width: calc(100% - 8px);
height: calc(100% - 8px);
border-radius: 50%;
}

.ptr {
position: absolute;
top: -12px;
left: 50%;
transform: translateX(-50%);
z-index: 20;
filter: drop-shadow(0 3px 6px rgba(255,215,0,0.7));
}

.hub {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%,-50%);
width: clamp(52px,14vw,70px);
height: clamp(52px,14vw,70px);
border-radius: 50%;
background: radial-gradient(circle at 35% 35%, #ff8c00, var(–red));
border: 3px solid var(–gold);
display: flex; align-items: center; justify-content: center;
z-index: 15; cursor: pointer;
box-shadow: 0 0 20px rgba(255,107,0,0.6);
transition: transform 0.15s;
}

.hub:active { transform: translate(-50%,-50%) scale(0.92); }

.hub span {
font-family: ‘Bangers’,‘Impact’,sans-serif;
font-size: clamp(0.65rem,2.2vw,0.85rem);
letter-spacing: 2px; color: #fff;
text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}

/* === RESULT PANEL (over wheel) === */
.rpanel {
position: absolute;
inset: -2px;
z-index: 30;
display: none;
flex-direction: column;
border-radius: 16px;
overflow: hidden;
background: rgba(8,8,14,0.98);
border: 2px solid rgba(255,107,0,0.3);
box-shadow: 0 0 50px rgba(255,107,0,0.15);
}

.rpanel.on {
display: flex;
animation: popUp .4s cubic-bezier(.16,1,.3,1);
}

@keyframes popUp {
from { opacity:0; transform:scale(.85); }
to { opacity:1; transform:scale(1); }
}

.rp-top {
text-align: center;
padding: 10px 10px 4px;
flex-shrink: 0;
background: linear-gradient(180deg, rgba(255,107,0,0.1), transparent);
}

.rp-player {
font-family: ‘Bangers’,‘Impact’,sans-serif;
font-size: clamp(1.3rem,4.5vw,1.9rem);
color: var(–gold);
text-shadow: 0 2px 10px rgba(255,107,0,0.4);
line-height: 1.1;
}

.rp-move {
font-size: clamp(0.6rem,1.8vw,0.8rem);
color: rgba(255,255,255,0.45);
text-transform: uppercase;
letter-spacing: 3px;
margin-top: 1px;
}

.rp-badge {
display: inline-block;
margin-top: 4px;
padding: 2px 10px;
background: var(–red);
border-radius: 10px;
font-family: ‘Bangers’,‘Impact’,sans-serif;
font-size: 0.6rem;
letter-spacing: 2px;
color: #fff;
}

.vid-box {
flex: 1;
min-height: 0;
margin: 5px 8px;
border-radius: 8px;
overflow: hidden;
background: #000;
position: relative;
}

.vid-box iframe {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
border: none;
}

/* Fallback YT link over iframe */
.yt-fallback {
position: absolute;
bottom: 8px; right: 8px;
z-index: 5;
padding: 5px 12px;
background: rgba(255,0,0,0.85);
color: #fff;
text-decoration: none;
border-radius: 6px;
font-size: 0.7rem;
font-weight: 700;
letter-spacing: 1px;
}

.rp-bottom {
flex-shrink: 0;
padding: 4px 8px 10px;
text-align: center;
}

.rp-desc {
font-size: clamp(0.6rem,1.6vw,0.78rem);
color: rgba(255,255,255,0.4);
line-height: 1.3;
margin-bottom: 3px;
}

.rp-stars {
font-size: 0.75rem;
color: rgba(255,255,255,0.25);
margin-bottom: 6px;
}

.rp-stars .on { color: var(–gold); }

.rp-btns {
display: flex;
gap: 5px;
justify-content: center;
}

.rp-btns button {
padding: 7px 16px;
font-family: ‘Bangers’,‘Impact’,sans-serif;
font-size: clamp(0.8rem,2.4vw,0.95rem);
letter-spacing: 1.5px;
border: none; border-radius: 18px;
cursor: pointer; transition: transform .1s;
}

.rp-btns button:active { transform: scale(.95); }
.b-nail { color:#111; background: linear-gradient(135deg,#00E676,#00C853); }
.b-back { color:#fff; background: rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15)!important; }
.b-next { color:#111; background: linear-gradient(135deg,var(–gold),var(–orange)); }

.spin-btn {
margin-top: 14px;
padding: 12px 44px;
font-family: ‘Bangers’,‘Impact’,sans-serif;
font-size: clamp(1.3rem,4.5vw,1.7rem);
letter-spacing: 4px; color: #111;
background: linear-gradient(135deg,var(–gold),var(–orange));
border: none; border-radius: 36px;
cursor: pointer;
box-shadow: 0 4px 20px rgba(255,107,0,0.4);
transition: transform .15s;
}

.spin-btn:active { transform: scale(.96); }
.spin-btn:disabled { opacity:.4; pointer-events:none; }

.scores {
display: flex; gap: 16px; margin-top: 12px;
padding: 5px 18px;
background: rgba(255,255,255,.05);
border-radius: 20px;
border: 1px solid rgba(255,255,255,.07);
}

.st { display:flex; align-items:center; gap:5px; }
.st .lb { font-size:.6rem; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:2px; }
.st .nm { font-family:‘Bangers’,‘Impact’,sans-serif; font-size:1.3rem; color:var(–gold); }
.st .ic { font-size:1rem; }

.cbox { position:fixed; inset:0; pointer-events:none; z-index:200; }
.cbit { position:absolute; top:-10px; animation:cfall 2.5s ease-in forwards; }
@keyframes cfall {
0% { transform:translateY(0) rotate(0); opacity:1; }
100% { transform:translateY(105vh) rotate(720deg); opacity:0; }
}

@media(max-width:400px) {
.wheel-zone { width:92vw; }
.rp-btns button { padding:6px 12px; font-size:.78rem; }
}
</style>

</head>

const C=[
  '#C8102E','#1D428A','#552583','#007A33','#CE1141',
  '#006BB6','#F58426','#860038','#E56020','#00471B',
  '#1D1160','#236192','#EF3B24','#002D62','#FFC72C',
  '#00788C','#E31837','#002B5C','#F9A01B','#5D76A9',
  '#C8102E','#1D428A','#552583','#007A33','#CE1141',
  '#006BB6','#F58426','#860038','#E56020','#00471B',
  '#1D1160','#236192','#EF3B24','#002D62','#FFC72C',
  '#00788C','#E31837','#002B5C','#F9A01B','#5D76A9',
  '#C8102E','#1D428A','#552583','#007A33','#CE1141',
  '#006BB6','#F58426','#860038','#E56020','#00471B',
];

const cv=document.getElementById('c'), cx2=cv.getContext('2d');
let ang=0, busy=false, sc=0, sk=0;

function sz(){
  const w=document.getElementById('wz').clientWidth-8;
  cv.width=w*2; cv.height=w*2;
  cv.style.width=w+'px'; cv.style.height=w+'px';
  draw();
}

function draw(){
  const cx=cv.width/2, cy=cv.height/2, r=cx-4;
  const seg=(2*Math.PI)/M.length;
  cx2.clearRect(0,0,cv.width,cv.height);

  M.forEach((_,i)=>{
    const a1=ang+i*seg, a2=a1+seg;

    // Segment fill
    cx2.beginPath();
    cx2.moveTo(cx,cy);
    cx2.arc(cx,cy,r,a1,a2);
    cx2.closePath();
    cx2.fillStyle=C[i];
    cx2.fill();
    cx2.strokeStyle='rgba(0,0,0,0.3)';
    cx2.lineWidth=1;
    cx2.stroke();

    // Last name text along the segment
    cx2.save();
    cx2.translate(cx,cy);
    cx2.rotate(a1+seg/2);
    cx2.textAlign='right';
    cx2.textBaseline='middle';

    // White text with black outline for max readability
    const fs=Math.max(10,Math.min(15,r*0.042));
    cx2.font=`700 ${fs}px 'Oswald', 'Arial Black', sans-serif`;

    const name=M[i].ln;
    const tx=r-10;

    // Black outline
    cx2.strokeStyle='rgba(0,0,0,0.8)';
    cx2.lineWidth=3;
    cx2.lineJoin='round';
    cx2.strokeText(name,tx,0);

    // White fill
    cx2.fillStyle='#fff';
    cx2.fillText(name,tx,0);

    cx2.restore();
  });

  // Center dark circle
  cx2.beginPath();
  cx2.arc(cx,cy,36,0,2*Math.PI);
  cx2.fillStyle='rgba(0,0,0,0.5)';
  cx2.fill();
}

function winner(){
  const seg=(2*Math.PI)/M.length;
  let n=((-Math.PI/2-ang)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  return Math.floor(n/seg)%M.length;
}

function doSpin(){
  if(busy) return;
  doClose();
  busy=true;
  document.getElementById('spinBtn').disabled=true;

  const dur=4000+Math.random()*2500;
  const rot=(8+Math.random()*7)*Math.PI*2;
  const s=ang, t0=performance.now();

  (function f(now){
    const p=Math.min((now-t0)/dur,1);
    ang=s+rot*(1-Math.pow(1-p,4));
    draw();
    if(p<1) requestAnimationFrame(f);
    else{
      busy=false;
      document.getElementById('spinBtn').disabled=false;
      showR();
    }
  })(t0);
}

function showR(){
  const mv=M[winner()];
  document.getElementById('rpP').textContent=mv.p;
  document.getElementById('rpM').textContent=mv.m;
  document.getElementById('rpD').textContent=mv.d;

  const on='\u2605',off='\u2606';
  document.getElementById('rpS').innerHTML=
    `<span class="on">${on.repeat(mv.s)}</span>${off.repeat(5-mv.s)}`;

  // Set YouTube embed with search-based playlist
  const q=encodeURIComponent(mv.q);
  const iframe=document.getElementById('vf');
  iframe.src=`https://www.youtube.com/embed?listType=search&list=${q}&autoplay=1&playsinline=1&rel=0&modestbranding=1`;

  // Also set the fallback direct YouTube search link
  document.getElementById('ytLink').href=
    `https://www.youtube.com/results?search_query=${q}`;

  document.getElementById('rp').classList.add('on');
}

function doClose(){
  document.getElementById('rp').classList.remove('on');
  document.getElementById('vf').src='about:blank';
}

function doNail(){
  sc++; sk++;
  document.getElementById('sc').textContent=sc;
  document.getElementById('sk').textContent=sk;
  document.getElementById('skI').innerHTML=
    sk>=5?'&#128293;&#128293;&#128293;':sk>=3?'&#128293;&#128293;':'&#128293;';
  boom();
  doClose();
}

function doNext(){
  doClose();
  setTimeout(doSpin,350);
}

function boom(){
  const b=document.getElementById('cbox');
  const cc=['#FF6B00','#FFD700','#C8102E','#1D428A','#00E676','#FF4081','#fff'];
  for(let i=0;i<45;i++){
    const e=document.createElement('div');
    e.className='cbit';
    e.style.left=Math.random()*100+'%';
    e.style.backgroundColor=cc[~~(Math.random()*cc.length)];
    e.style.animationDelay=Math.random()*.4+'s';
    e.style.animationDuration=(2+Math.random()*1.5)+'s';
    const z=5+Math.random()*7;
    e.style.width=z+'px'; e.style.height=z+'px';
    e.style.borderRadius=Math.random()>.5?'50%':'2px';
    b.appendChild(e);
    setTimeout(()=>e.remove(),3000);
  }
}

document.getElementById('hubBtn').onclick=doSpin;
window.onresize=sz;
sz();
</script>
