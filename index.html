<style>
  :root {
    --orange: #FF6B00;
    --neon-orange: #FF8C00;
    --dark: #0A0A12;
    --darker: #06060A;
    --white: #FAFAFA;
    --gold: #FFD700;
    --blue: #1D428A;
    --red: #C8102E;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–dark);
color: var(–white);
font-family: ‘Oswald’, sans-serif;
overflow-x: hidden;
min-height: 100vh;
}

body::before {
content: ‘’;
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
background:
radial-gradient(ellipse at 50% 50%, rgba(200,112,42,0.06) 0%, transparent 70%),
repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(255,107,0,0.03) 80px, rgba(255,107,0,0.03) 81px),
repeating-linear-gradient(0deg, transparent, transparent 80px, rgba(255,107,0,0.03) 80px, rgba(255,107,0,0.03) 81px);
pointer-events: none;
z-index: 0;
}

.header {
text-align: center;
padding: 30px 20px 10px;
position: relative;
z-index: 1;
}

.header h1 {
font-family: ‘Bangers’, cursive;
font-size: clamp(2.5rem, 6vw, 4.5rem);
letter-spacing: 4px;
background: linear-gradient(180deg, var(–gold) 0%, var(–orange) 50%, var(–red) 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(0 4px 20px rgba(255,107,0,0.4));
line-height: 1.1;
}

.header .subtitle {
font-family: ‘Oswald’, sans-serif;
font-size: clamp(0.9rem, 2vw, 1.2rem);
color: rgba(255,255,255,0.5);
letter-spacing: 6px;
text-transform: uppercase;
margin-top: 5px;
}

.game-container {
display: flex;
flex-direction: column;
align-items: center;
padding: 20px;
position: relative;
z-index: 1;
}

.wheel-section {
position: relative;
width: min(85vw, 520px);
}

.wheel-wrapper {
position: relative;
width: 100%;
padding-bottom: 100%;
}

.wheel-outer-ring {
position: absolute;
top: -12px; left: -12px; right: -12px; bottom: -12px;
border-radius: 50%;
background: conic-gradient(from 0deg, var(–orange), var(–gold), var(–orange), var(–red), var(–orange), var(–gold), var(–orange));
animation: ringPulse 3s ease-in-out infinite;
opacity: 0.7;
}

@keyframes ringPulse {
0%, 100% { opacity: 0.5; transform: scale(1); }
50% { opacity: 0.8; transform: scale(1.005); }
}

.wheel-inner-bg {
position: absolute;
top: 3px; left: 3px; right: 3px; bottom: 3px;
border-radius: 50%;
background: var(–darker);
}

canvas#wheel {
position: absolute;
top: 6px; left: 6px;
width: calc(100% - 12px);
height: calc(100% - 12px);
border-radius: 50%;
cursor: pointer;
transition: filter 0.3s;
}

canvas#wheel:hover { filter: brightness(1.1); }

.pointer {
position: absolute;
top: -18px;
left: 50%;
transform: translateX(-50%);
z-index: 10;
width: 0; height: 0;
border-left: 20px solid transparent;
border-right: 20px solid transparent;
border-top: 40px solid var(–gold);
filter: drop-shadow(0 4px 12px rgba(255,215,0,0.6));
}

.pointer::after {
content: ‘’;
position: absolute;
top: -42px; left: -10px;
width: 0; height: 0;
border-left: 10px solid transparent;
border-right: 10px solid transparent;
border-top: 14px solid var(–neon-orange);
}

.center-hub {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 80px; height: 80px;
border-radius: 50%;
background: radial-gradient(circle, var(–orange) 0%, var(–red) 100%);
border: 4px solid var(–gold);
display: flex;
align-items: center;
justify-content: center;
z-index: 5;
cursor: pointer;
box-shadow: 0 0 30px rgba(255,107,0,0.5);
transition: transform 0.2s, box-shadow 0.2s;
}

.center-hub:hover {
transform: translate(-50%, -50%) scale(1.1);
box-shadow: 0 0 50px rgba(255,107,0,0.8);
}

.center-hub span {
font-family: ‘Bangers’, cursive;
font-size: 1rem;
letter-spacing: 2px;
color: white;
text-align: center;
line-height: 1.1;
}

/* ====================== */
/* VIDEO OVERLAY ON WHEEL */
/* ====================== */
.video-overlay {
position: absolute;
top: -12px; left: -12px; right: -12px; bottom: -12px;
z-index: 50;
display: none;
flex-direction: column;
border-radius: 20px;
overflow: hidden;
background: rgba(6, 6, 10, 0.97);
border: 2px solid rgba(255,107,0,0.4);
box-shadow: 0 0 80px rgba(255,107,0,0.25), inset 0 0 60px rgba(0,0,0,0.5);
animation: overlayIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.video-overlay.active { display: flex; }

@keyframes overlayIn {
from { opacity: 0; transform: scale(0.85); }
to { opacity: 1; transform: scale(1); }
}

.overlay-content {
display: flex;
flex-direction: column;
height: 100%;
padding: 14px;
}

.overlay-header {
text-align: center;
flex-shrink: 0;
padding-bottom: 6px;
}

.overlay-header .player-name {
font-family: ‘Bangers’, cursive;
font-size: clamp(1.5rem, 4vw, 2.2rem);
background: linear-gradient(135deg, var(–gold), var(–orange));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
line-height: 1.1;
}

.overlay-header .move-name {
font-family: ‘Oswald’, sans-serif;
font-size: clamp(0.75rem, 2vw, 1rem);
color: rgba(255,255,255,0.6);
text-transform: uppercase;
letter-spacing: 3px;
margin-top: 2px;
}

.challenge-badge {
display: inline-block;
margin-top: 6px;
padding: 3px 14px;
background: linear-gradient(135deg, var(–red), #8B0000);
border-radius: 20px;
font-family: ‘Bangers’, cursive;
font-size: 0.75rem;
letter-spacing: 2px;
color: white;
}

.video-frame-wrap {
flex: 1;
min-height: 0;
position: relative;
border-radius: 10px;
overflow: hidden;
background: #000;
border: 1px solid rgba(255,107,0,0.15);
margin: 8px 0;
}

.video-frame-wrap iframe {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
border: none;
}

.overlay-footer {
flex-shrink: 0;
text-align: center;
}

.move-desc {
font-size: clamp(0.7rem, 1.6vw, 0.9rem);
color: rgba(255,255,255,0.55);
line-height: 1.3;
margin-bottom: 4px;
}

.difficulty {
font-size: 0.8rem;
color: rgba(255,255,255,0.4);
margin-bottom: 8px;
}

.difficulty .stars { color: var(–gold); font-size: 0.9rem; }

.overlay-actions {
display: flex;
gap: 8px;
justify-content: center;
flex-wrap: wrap;
}

.btn-nailed {
padding: 9px 20px;
font-family: ‘Bangers’, cursive;
font-size: 1.05rem;
letter-spacing: 2px;
color: var(–dark);
background: linear-gradient(135deg, #00E676, #00C853);
border: none;
border-radius: 30px;
cursor: pointer;
transition: all 0.2s;
}

.btn-nailed:hover {
transform: scale(1.05);
box-shadow: 0 4px 16px rgba(0,230,118,0.4);
}

.btn-back {
padding: 9px 20px;
font-family: ‘Bangers’, cursive;
font-size: 1.05rem;
letter-spacing: 2px;
color: white;
background: rgba(255,255,255,0.1);
border: 1px solid rgba(255,255,255,0.2);
border-radius: 30px;
cursor: pointer;
transition: all 0.2s;
}

.btn-back:hover {
background: rgba(255,255,255,0.15);
transform: scale(1.05);
}

.btn-next {
padding: 9px 20px;
font-family: ‘Bangers’, cursive;
font-size: 1.05rem;
letter-spacing: 2px;
color: var(–dark);
background: linear-gradient(135deg, var(–gold), var(–orange));
border: none;
border-radius: 30px;
cursor: pointer;
transition: all 0.2s;
}

.btn-next:hover {
transform: scale(1.05);
box-shadow: 0 4px 16px rgba(255,107,0,0.4);
}

/* Spin button */
.spin-btn {
margin-top: 20px;
padding: 16px 60px;
font-family: ‘Bangers’, cursive;
font-size: 1.8rem;
letter-spacing: 4px;
color: var(–dark);
background: linear-gradient(135deg, var(–gold), var(–orange));
border: none;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 6px 30px rgba(255,107,0,0.4), inset 0 2px 0 rgba(255,255,255,0.3);
transition: all 0.3s;
position: relative;
overflow: hidden;
}

.spin-btn::before {
content: ‘’;
position: absolute;
top: 0; left: -100%;
width: 100%; height: 100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
transition: left 0.5s;
}

.spin-btn:hover::before { left: 100%; }
.spin-btn:hover {
transform: translateY(-3px);
box-shadow: 0 10px 40px rgba(255,107,0,0.6);
}

.spin-btn:active { transform: translateY(0); }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.streak-bar {
display: flex;
align-items: center;
gap: 15px;
margin-top: 15px;
padding: 8px 24px;
background: rgba(255,255,255,0.05);
border-radius: 30px;
border: 1px solid rgba(255,107,0,0.2);
}

.streak-bar .label {
font-size: 0.85rem;
color: rgba(255,255,255,0.4);
text-transform: uppercase;
letter-spacing: 3px;
}

.streak-bar .count {
font-family: ‘Bangers’, cursive;
font-size: 1.6rem;
color: var(–gold);
}

.fire { font-size: 1.3rem; }

.confetti-container {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
pointer-events: none;
z-index: 200;
}

.confetti-piece {
position: absolute;
width: 10px; height: 10px;
top: -10px;
animation: confettiFall 2.5s ease-in forwards;
}

@keyframes confettiFall {
0% { transform: translateY(0) rotate(0deg); opacity: 1; }
100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 600px) {
.header { padding: 20px 15px 5px; }
.wheel-section { width: 95vw; }
.center-hub { width: 60px; height: 60px; }
.center-hub span { font-size: 0.8rem; }
.spin-btn { padding: 14px 40px; font-size: 1.5rem; }
.overlay-actions { gap: 6px; }
.overlay-actions button { padding: 7px 14px; font-size: 0.95rem; }
.overlay-content { padding: 10px; }
}
</style>

</head>

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
let currentAngle = 0;
let spinning = false;
let score = 0;
let streak = 0;

function resizeCanvas() {
  const wrapper = document.querySelector('.wheel-wrapper');
  const size = wrapper.clientWidth - 12;
  canvas.width = size * 2;
  canvas.height = size * 2;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  drawWheel();
}

function drawWheel() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = cx - 10;
  const segAngle = (2 * Math.PI) / moves.length;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  moves.forEach((m, i) => {
    const startAngle = currentAngle + i * segAngle;
    const endAngle = startAngle + segAngle;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + segAngle / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'white';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 3;
    const fontSize = Math.max(11, Math.min(16, r * 0.045));
    ctx.font = `bold ${fontSize}px 'Oswald', sans-serif`;
    ctx.fillText(m.player.split(' ').pop(), r - 14, fontSize * 0.35);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 52, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();
}

function getWinningIndex() {
  const segAngle = (2 * Math.PI) / moves.length;
  const pointerAngle = -Math.PI / 2;
  let norm = ((pointerAngle - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(norm / segAngle) % moves.length;
}

function spinWheel() {
  if (spinning) return;
  closeOverlay();
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const spinDuration = 4000 + Math.random() * 2000;
  const totalRotation = (8 + Math.random() * 6) * Math.PI * 2;
  const startAngle = currentAngle;
  const startTime = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / spinDuration, 1);
    currentAngle = startAngle + totalRotation * easeOut(progress);
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      showResult();
    }
  }

  requestAnimationFrame(animate);
}

function showResult() {
  const idx = getWinningIndex();
  const move = moves[idx];

  document.getElementById('overlayPlayer').textContent = move.player;
  document.getElementById('overlayMove').textContent = move.move;
  document.getElementById('overlayDesc').textContent = move.desc;

  const stars = '\u2605'.repeat(move.difficulty) + '\u2606'.repeat(5 - move.difficulty);
  document.getElementById('overlayDifficulty').innerHTML =
    `Difficulty: <span class="stars">${stars}</span>`;

  // Embed YouTube video directly in the overlay iframe
  document.getElementById('videoFrame').src =
    `https://www.youtube.com/embed/${move.yt}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;

  document.getElementById('videoOverlay').classList.add('active');
}

function closeOverlay() {
  document.getElementById('videoOverlay').classList.remove('active');
  document.getElementById('videoFrame').src = '';
}

function nailedIt() {
  score++;
  streak++;
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
  document.getElementById('streakFire').innerHTML =
    streak >= 5 ? '&#128293;&#128293;&#128293;' :
    streak >= 3 ? '&#128293;&#128293;' : '&#128293;';
  launchConfetti();
  closeOverlay();
}

function closeAndSpin() {
  closeOverlay();
  setTimeout(() => spinWheel(), 400);
}

function launchConfetti() {
  const container = document.getElementById('confetti');
  const cols = ['#FF6B00','#FFD700','#C8102E','#1D428A','#00E676','#FF4081','#FFF'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.backgroundColor = cols[Math.floor(Math.random() * cols.length)];
    p.style.animationDelay = Math.random() * 0.5 + 's';
    p.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    p.style.width = (6 + Math.random() * 8) + 'px';
    p.style.height = (6 + Math.random() * 8) + 'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    container.appendChild(p);
    setTimeout(() => p.remove(), 3000);
  }
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
