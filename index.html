<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NBA Move Master</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bangers&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0a14;color:#fff;font-family:'Oswald','Arial Black',sans-serif;overflow-x:hidden;min-height:100vh;-webkit-tap-highlight-color:transparent}
.hd{text-align:center;padding:20px 16px 4px}
.hd h1{font-family:'Bangers','Impact',sans-serif;font-size:clamp(2rem,8vw,3.5rem);letter-spacing:3px;color:#FFD700;text-shadow:0 0 30px rgba(255,215,0,.3),0 2px 16px rgba(255,107,0,.5);line-height:1}
.hd .sb{font-size:clamp(.65rem,2.2vw,.9rem);color:rgba(255,255,255,.5);letter-spacing:5px;text-transform:uppercase;margin-top:4px;font-weight:500}
.gm{display:flex;flex-direction:column;align-items:center;padding:8px 16px 24px}
.wz{position:relative;width:84vw;max-width:440px;margin:6px auto;overflow:visible}
.wz svg.wheel{display:block;width:100%;height:auto;border-radius:50%;overflow:hidden}
.pt{position:absolute;top:-12px;left:50%;margin-left:-16px;z-index:20}
.hb{position:absolute;top:50%;left:50%;width:60px;height:60px;margin-top:-30px;margin-left:-30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8c00,#C8102E);border:3px solid #FFD700;display:flex;align-items:center;justify-content:center;z-index:15;cursor:pointer;box-shadow:0 0 20px rgba(255,107,0,.6)}
.hb span{font-family:'Bangers','Impact',sans-serif;font-size:.8rem;letter-spacing:2px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rp{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0d0d1a 0%,#111118 50%,#0d0d1a 100%);border:2px solid rgba(255,107,0,.3);box-shadow:0 0 60px rgba(255,107,0,.15)}
.rp.on{display:flex;animation:pop .4s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.rt{text-align:center;padding:12px 12px 4px;flex-shrink:0;background:linear-gradient(180deg,rgba(255,107,0,.12),transparent)}
.rpl{font-family:'Bangers','Impact',sans-serif;font-size:clamp(1.3rem,4.5vw,1.8rem);color:#FFD700;text-shadow:0 2px 10px rgba(255,107,0,.4);line-height:1.1}
.rpm{font-size:clamp(.65rem,1.8vw,.8rem);color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:3px;margin-top:2px}
.ga{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 10px;overflow:hidden;position:relative}
.ga iframe{width:100%;height:100%;border:0;border-radius:10px;background:#000}
.ga video,.ga img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.ga .ld{color:rgba(255,255,255,.25);font-size:.7rem;letter-spacing:2px;text-align:center}
.ga .ld .ball{font-size:1.5rem;display:block;margin-bottom:4px;animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.rb{flex-shrink:0;padding:6px 10px 10px;text-align:center}
.rd{font-size:clamp(.7rem,1.8vw,.85rem);color:rgba(255,255,255,.6);line-height:1.4;margin-bottom:4px}
.rs{font-size:.75rem;color:rgba(255,255,255,.35);margin-bottom:5px}
.rs .on{color:#FFD700}
.rpb{display:inline-block;margin-bottom:4px;padding:2px 10px;background:#C8102E;border-radius:10px;font-family:'Bangers','Impact',sans-serif;font-size:.55rem;letter-spacing:2px;color:#fff}
.rbs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.rbs button{padding:7px 16px;font-family:'Bangers','Impact',sans-serif;font-size:clamp(.8rem,2.4vw,.95rem);letter-spacing:1.5px;border:none;border-radius:18px;cursor:pointer;transition:transform .1s}
.rbs button:active{transform:scale(.95)}
.bn{color:#111;background:linear-gradient(135deg,#00E676,#00C853)}
.bb{color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)!important}
.bx{color:#111;background:linear-gradient(135deg,#FFD700,#FF6B00)}
.sp{display:block;margin:10px auto 0;padding:14px 50px;font-family:'Bangers','Impact',sans-serif;font-size:clamp(1rem,4vw,1.4rem);letter-spacing:4px;color:#111;background:linear-gradient(135deg,#FFD700,#FF6B00);border:none;border-radius:30px;cursor:pointer;box-shadow:0 4px 25px rgba(255,107,0,.4);transition:transform .15s}
.sp:active{transform:scale(.96)}
.sp:disabled{opacity:.5;cursor:not-allowed}
.sc{display:flex;gap:20px;justify-content:center;margin-top:12px;padding:8px 24px;background:rgba(255,255,255,.04);border-radius:20px;border:1px solid rgba(255,215,0,.12)}
.st{display:flex;align-items:center;gap:5px}
.l{font-size:clamp(.6rem,1.8vw,.75rem);color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:2px;font-weight:700}
.n{font-family:'Bangers','Impact',sans-serif;font-size:clamp(1.1rem,4vw,1.5rem);color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,.3)}
.i{font-size:clamp(.9rem,3vw,1.1rem)}
.cb{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:100}
.cf{position:absolute;top:-10px;width:8px;height:8px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>

var ang=0,busy=false,sc=0,sk=0,curLoad=0;
var segs=document.getElementById(‘segs’);

function setRot(d){ segs.setAttribute(‘transform’,‘rotate(’+d+’,250,250)’); }

function win(){
var segA=360/M.length;
var nd=((ang%360)+360)%360;
return Math.floor((360-nd)/segA)%M.length;
}

function spin(){
if(busy)return;cls();busy=true;
document.getElementById(‘spn’).disabled=true;
var dur=4000+Math.random()*2500,rot=360*(8+Math.random()*7),s=ang,t0=performance.now();
(function f(now){
var p=Math.min((now-t0)/dur,1);
ang=s+rot*(1-Math.pow(1-p,4));setRot(ang);
if(p<1)requestAnimationFrame(f);
else{busy=false;document.getElementById(‘spn’).disabled=false;show();}
})(t0);
}

function loadVideo(mv,ga,loadId){
ga.innerHTML=’<div class="ld"><span class="ball">🏀</span>LOADING…</div>’;
if(mv.yt){
var ifr=document.createElement(‘iframe’);
ifr.src=‘https://www.youtube.com/embed/’+mv.yt+’?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1’;
ifr.allow=‘autoplay;encrypted-media’;ifr.allowFullscreen=true;
ifr.style.cssText=‘width:100%;height:100%;border:0;border-radius:10px;background:#000’;
ga.innerHTML=’’;ga.appendChild(ifr);return;
}
if(mv.tk){
var ifr2=document.createElement(‘iframe’);
ifr2.src=‘https://www.tiktok.com/player/v1/’+mv.tk+’?music_info=0&description=0&autoplay=1&loop=1’;
ifr2.allow=‘autoplay’;
ifr2.style.cssText=‘width:100%;height:100%;border:0;border-radius:10px;background:#000’;
ga.innerHTML=’’;ga.appendChild(ifr2);return;
}
loadGiphy(mv,ga,loadId);
}

function loadGiphy(mv,ga,loadId){
var q=encodeURIComponent(mv.gq||mv.p+’ ‘+mv.m);
fetch(‘https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=’+q+’&limit=3&rating=g’)
.then(function(r){return r.json();})
.then(function(data){
if(curLoad!==loadId)return;
if(data.data&&data.data.length>0){
var gif=data.data[0];var mp4=null,gifUrl=null;
try{mp4=gif.images.original.mp4;}catch(e){}
try{gifUrl=gif.images.fixed_height.url;}catch(e){}
if(!gifUrl)try{gifUrl=gif.images.original.url;}catch(e){}
if(mp4){
var vid=document.createElement(‘video’);
vid.autoplay=true;vid.loop=true;vid.muted=true;vid.playsInline=true;
vid.setAttribute(‘playsinline’,’’);vid.src=mp4;
vid.onloadeddata=function(){if(curLoad===loadId){ga.innerHTML=’’;ga.appendChild(vid);vid.play().catch(function(){});}};
vid.onerror=function(){if(gifUrl&&curLoad===loadId){var img=new Image();img.src=gifUrl;img.onload=function(){if(curLoad===loadId){ga.innerHTML=’’;ga.appendChild(img);}};img.onerror=function(){showFB(mv,ga);};}else showFB(mv,ga);};
} else if(gifUrl){
var img=new Image();img.src=gifUrl;
img.onload=function(){if(curLoad===loadId){ga.innerHTML=’’;ga.appendChild(img);}};
img.onerror=function(){showFB(mv,ga);};
} else showFB(mv,ga);
} else showFB(mv,ga);
}).catch(function(){if(curLoad===loadId)showFB(mv,ga);});
}

function showFB(mv,ga){ga.innerHTML=’<div style="text-align:center;padding:20px"><div style="font-size:4rem;animation:bounce .6s ease-in-out infinite alternate">🏀</div><div style="font-family:Bangers,sans-serif;font-size:1.3rem;color:#FFD700;margin-top:10px;letter-spacing:2px">’+mv.m.toUpperCase()+’</div><div style="color:rgba(255,255,255,.4);font-size:.7rem;margin-top:6px">SHOW US YOUR MOVE!</div></div>’;}

function show(){

var ga=document.getElementById(‘gifArea’);ga.innerHTML=’’;curLoad++;
document.getElementById(‘rp’).classList.add(‘on’);
loadVideo(mv,ga,curLoad);
}

function cls(){

function boom(){

var cc=[’#FF6B00’,’#FFD700’,’#C8102E’,’#1D428A’,’#00E676’,’#FF4081’,’#fff’];
for(var i=0;i<45;i++){var e=document.createElement(‘div’);e.className=‘cf’;e.style.left=Math.random()*100+’%’;e.style.backgroundColor=cc[~~(Math.random()*cc.length)];e.style.animationDelay=Math.random()*.4+‘s’;e.style.animationDuration=(2+Math.random()*1.5)+‘s’;var z=5+Math.random()*7;e.style.width=z+‘px’;e.style.height=z+‘px’;e.style.borderRadius=Math.random()>.5?‘50%’:‘2px’;b.appendChild(e);setTimeout(function(){e.remove();},3000);}
}
