<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NBA Move Master</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;700&family=Bangers&display=swap');

:root {
–orange: #FF6B00;
–dark: #111118;
–darker: #0a0a10;
–gold: #FFD700;
–red: #C8102E;
}

- { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
background: var(–dark);
color: #fff;
font-family: ‘Oswald’, ‘Arial Black’, Arial, sans-serif;
overflow-x: hidden;
min-height: 100vh;
-webkit-tap-highlight-color: transparent;
}

.header {
text-align: center;
padding: 24px 16px 8px;
}

.header h1 {
font-family: ‘Bangers’, ‘Impact’, sans-serif;
font-size: clamp(2.2rem, 8vw, 3.8rem);
letter-spacing: 3px;
color: var(–gold);
text-shadow: 0 2px 20px rgba(255,107,0,0.5), 0 0 40px rgba(255,107,0,0.2);
line-height: 1;
}

.header .sub {
font-size: clamp(0.7rem, 2.5vw, 1rem);
color: rgba(255,255,255,0.35);
letter-spacing: 5px;
text-transform: uppercase;
margin-top: 4px;
}

.game {
display: flex;
flex-direction: column;
align-items: center;
padding: 12px 16px;
}

/* WHEEL */
.wheel-area {
position: relative;
width: min(82vw, 420px);
aspect-ratio: 1;
margin: 8px auto;
}

.wheel-glow {
position: absolute;
inset: -14px;
border-radius: 50%;
background: conic-gradient(from 0deg, var(–orange), var(–gold), var(–orange), var(–red), var(–orange), var(–gold), var(–orange));
opacity: 0.5;
filter: blur(2px);
animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {
0%,100% { opacity: 0.35; }
50% { opacity: 0.6; }
}

.wheel-bg {
position: absolute;
inset: 2px;
border-radius: 50%;
background: var(–darker);
}

canvas {
position: absolute;
inset: 5px;
width: calc(100% - 10px);
height: calc(100% - 10px);
border-radius: 50%;
}

.arrow {
position: absolute;
top: -14px;
left: 50%;
transform: translateX(-50%);
z-index: 20;
filter: drop-shadow(0 3px 8px rgba(255,215,0,0.7));
}

.hub {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: clamp(56px, 16vw, 76px);
height: clamp(56px, 16vw, 76px);
border-radius: 50%;
background: radial-gradient(circle at 35% 35%, #ff8c00, var(–red));
border: 3px solid var(–gold);
display: flex;
align-items: center;
justify-content: center;
z-index: 15;
cursor: pointer;
box-shadow: 0 0 24px rgba(255,107,0,0.6);
transition: transform 0.15s;
}

.hub:active { transform: translate(-50%, -50%) scale(0.93); }

.hub span {
font-family: ‘Bangers’, ‘Impact’, sans-serif;
font-size: clamp(0.7rem, 2.5vw, 0.95rem);
letter-spacing: 2px;
color: #fff;
text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* RESULT OVERLAY */
.result-overlay {
position: absolute;
inset: -4px;
z-index: 30;
display: none;
flex-direction: column;
border-radius: 18px;
overflow: hidden;
background: rgba(10, 10, 18, 0.98);
border: 2px solid rgba(255,107,0,0.35);
box-shadow: 0 0 60px rgba(255,107,0,0.2);
}

.result-overlay.show {
display: flex;
animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes popIn {
from { opacity: 0; transform: scale(0.85); }
to { opacity: 1; transform: scale(1); }
}

.result-top {
text-align: center;
padding: 12px 12px 4px;
flex-shrink: 0;
background: linear-gradient(180deg, rgba(255,107,0,0.12) 0%, transparent 100%);
}

.result-player {
font-family: ‘Bangers’, ‘Impact’, sans-serif;
font-size: clamp(1.4rem, 5vw, 2rem);
color: var(–gold);
text-shadow: 0 2px 12px rgba(255,107,0,0.4);
line-height: 1.1;
}

.result-move {
font-size: clamp(0.65rem, 2vw, 0.85rem);
color: rgba(255,255,255,0.5);
text-transform: uppercase;
letter-spacing: 3px;
margin-top: 2px;
}

.result-badge {
display: inline-block;
margin-top: 4px;
padding: 2px 12px;
background: var(–red);
border-radius: 12px;
font-family: ‘Bangers’, ‘Impact’, sans-serif;
font-size: 0.65rem;
letter-spacing: 2px;
color: #fff;
}

.vid-wrap {
flex: 1;
min-height: 0;
margin: 6px 10px;
border-radius: 8px;
overflow: hidden;
background: #000;
position: relative;
}

#ytplayer {
position: absolute;
inset: 0;
width: 100% !important;
height: 100% !important;
}

.result-bottom {
flex-shrink: 0;
padding: 6px 10px 12px;
text-align: center;
}

.result-desc {
font-size: clamp(0.65rem, 1.8vw, 0.8rem);
color: rgba(255,255,255,0.45);
line-height: 1.3;
margin-bottom: 4px;
}

.result-stars {
font-size: 0.8rem;
color: rgba(255,255,255,0.3);
margin-bottom: 8px;
}

.result-stars .on { color: var(–gold); }

.result-btns {
display: flex;
gap: 6px;
justify-content: center;
}

.result-btns button {
padding: 8px 18px;
font-family: ‘Bangers’, ‘Impact’, sans-serif;
font-size: clamp(0.85rem, 2.5vw, 1rem);
letter-spacing: 1.5px;
border: none;
border-radius: 20px;
cursor: pointer;
transition: transform 0.1s;
}

.result-btns button:active { transform: scale(0.95); }

.btn-nailed { color: #111; background: linear-gradient(135deg, #00E676, #00C853); }
.btn-back { color: #fff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15) !important; }
.btn-next { color: #111; background: linear-gradient(135deg, var(–gold), var(–orange)); }

.spin-btn {
margin-top: 16px;
padding: 14px 50px;
font-family: ‘Bangers’, ‘Impact’, sans-serif;
font-size: clamp(1.4rem, 5vw, 1.8rem);
letter-spacing: 4px;
color: #111;
background: linear-gradient(135deg, var(–gold), var(–orange));
border: none;
border-radius: 40px;
cursor: pointer;
box-shadow: 0 4px 24px rgba(255,107,0,0.4);
transition: transform 0.15s;
}

.spin-btn:active { transform: scale(0.96); }
.spin-btn:disabled { opacity: 0.4; pointer-events: none; }

.scores {
display: flex;
gap: 20px;
margin-top: 14px;
padding: 6px 20px;
background: rgba(255,255,255,0.06);
border-radius: 24px;
border: 1px solid rgba(255,255,255,0.08);
}

.stat { display: flex; align-items: center; gap: 6px; }
.stat .lbl { font-size: 0.65rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 2px; }
.stat .num { font-family: ‘Bangers’, ‘Impact’, sans-serif; font-size: 1.4rem; color: var(–gold); }
.stat .ico { font-size: 1.1rem; }

.confetti-box { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
.confetti-bit { position: absolute; top: -12px; animation: fall 2.5s ease-in forwards; }
@keyframes fall {
0% { transform: translateY(0) rotate(0); opacity: 1; }
100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 400px) {
.wheel-area { width: 90vw; }
.result-btns button { padding: 7px 13px; font-size: 0.8rem; }
}
</style>

</head>

  { p:"Paul Pierce", m:"Step-Back Mid-Range", q:"Paul Pierce clutch mid range highlights NBA", d:"Create space with a step-back and nail it!", s:3 },
  { p:"Ray Allen", m:"Catch & Shoot Three", q:"Ray Allen catch and shoot three pointer highlights", d:"Run to the corner, catch, and shoot a quick three!", s:2 },
  { p:"Reggie Miller", m:"Off-Screen Three", q:"Reggie Miller three pointer highlights clutch NBA", d:"Run around a screen and shoot a quick three!", s:3 },
  { p:"Jason Williams", m:"Elbow Pass", q:"Jason Williams White Chocolate elbow pass NBA", d:"Bounce the ball off your elbow — tricky pass!", s:5 },

  { p:"Pete Maravich", m:"Behind-the-Back Pass", q:"Pete Maravich Pistol Pete highlights passing", d:"No-look behind-the-back pass! Pistol Pete!", s:4 },
  { p:"Kawhi Leonard", m:"Mid-Range Assassin", q:"Kawhi Leonard mid range jumper highlights playoffs", d:"Get to your spot in the mid-range and drain it!", s:3 },
  { p:"Joel Embiid", m:"Dream Shake Spin", q:"Joel Embiid post moves dream shake highlights", d:"Pump fake, spin, and finish with a hook!", s:4 },
  { p:"DeMar DeRozan", m:"Mid-Range Footwork", q:"DeMar DeRozan mid range footwork highlights", d:"Fancy footwork in the mid-range, hit a tough shot!", s:4 },
  { p:"Anthony Edwards", m:"Power Dunk", q:"Anthony Edwards dunk highlights NBA poster", d:"Attack the rim and throw it down! No mercy!", s:4 },
  { p:"Trae Young", m:"Deep Floater", q:"Trae Young floater highlights NBA deep", d:"Pull up from deep and float one in!", s:4 },
  { p:"Isiah Thomas", m:"Layup Package", q:"Isiah Thomas layup highlights Pistons NBA", d:"Creative, acrobatic finish at the rim!", s:3 },
  { p:"Charles Barkley", m:"Power Post Move", q:"Charles Barkley post moves dunks highlights NBA", d:"Back someone down with power and finish!", s:2 },
  { p:"Shawn Kemp", m:"Alley-Oop Slam", q:"Shawn Kemp alley oop dunk highlights NBA", d:"Toss it off the backboard, catch it, and slam!", s:4 },
  { p:"George Gervin", m:"Iceman Finger Roll", q:"George Gervin Iceman finger roll highlights NBA", d:"Glide to the basket and softly roll it in.", s:3 },
  { p:"Rajon Rondo", m:"Fake Pass Layup", q:"Rajon Rondo fake pass highlights NBA", d:"Look like you'll pass, pump fake, then finish!", s:2 },
];

const C = [
  '#C8102E','#1D428A','#552583','#007A33','#CE1141',
  '#006BB6','#F58426','#860038','#E56020','#00471B',
  '#1D1160','#236192','#EF3B24','#002D62','#FFC72C',
  '#00788C','#E31837','#002B5C','#F9A01B','#5D76A9',
  '#C8102E','#1D428A','#552583','#007A33','#CE1141',
  '#006BB6','#F58426','#860038','#E56020','#00471B',
  '#1D1160','#236192','#EF3B24','#002D62','#FFC72C',
  '#00788C','#E31837','#002B5C','#F9A01B','#5D76A9',
  '#C8102E','#1D428A','#552583','#007A33','#CE1141',
  '#006BB6','#F58426','#860038','#E56020','#00471B',
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let angle = 0, isSpinning = false, score = 0, streak = 0;
let ytPlayer = null;
let ytReady = false;

// YouTube IFrame API ready callback
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytplayer', {
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 0,
      modestbranding: 1,
      rel: 0,
      playsinline: 1,
      fs: 1,
    },
    events: {
      onReady: function() { ytReady = true; }
    }
  });
}

function loadVideo(searchQuery) {
  if (ytPlayer && ytReady) {
    // Use loadPlaylist with search - this searches YouTube and plays the first result
    ytPlayer.loadPlaylist({
      list: searchQuery,
      listType: 'search',
    });
  }
}

function stopVideo() {
  if (ytPlayer && ytReady) {
    try { ytPlayer.stopVideo(); } catch(e) {}
  }
}

function resize() {
  const area = document.getElementById('wheelArea');
  const w = area.clientWidth - 10;
  canvas.width = w * 2;
  canvas.height = w * 2;
  canvas.style.width = w + 'px';
  canvas.style.height = w + 'px';
  draw();
}

function draw() {
  const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 6;
  const seg = (2 * Math.PI) / M.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  M.forEach((_, i) => {
    const a1 = angle + i * seg, a2 = a1 + seg;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a1, a2);
    ctx.closePath();
    ctx.fillStyle = C[i];
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // White tick marks
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a1 + seg / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(r - 16, -1, 12, 2);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 38, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
}

function getWinner() {
  const seg = (2 * Math.PI) / M.length;
  let n = ((-Math.PI / 2 - angle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(n / seg) % M.length;
}

function spin() {
  if (isSpinning) return;
  closeResult();
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;

  const dur = 4000 + Math.random() * 2500;
  const rot = (8 + Math.random() * 7) * Math.PI * 2;
  const start = angle, t0 = performance.now();

  function ease(t) { return 1 - Math.pow(1 - t, 4); }

  (function frame(now) {
    const p = Math.min((now - t0) / dur, 1);
    angle = start + rot * ease(p);
    draw();
    if (p < 1) requestAnimationFrame(frame);
    else {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;
      showResult();
    }
  })(t0);
}

function showResult() {
  const mv = M[getWinner()];
  document.getElementById('rPlayer').textContent = mv.p;
  document.getElementById('rMove').textContent = mv.m;
  document.getElementById('rDesc').textContent = mv.d;

  const on = '\u2605', off = '\u2606';
  document.getElementById('rStars').innerHTML =
    `<span class="on">${on.repeat(mv.s)}</span>${off.repeat(5 - mv.s)}`;

  document.getElementById('resultBox').classList.add('show');

  // Load video via YouTube search
  setTimeout(() => loadVideo(mv.q), 300);
}

function closeResult() {
  document.getElementById('resultBox').classList.remove('show');
  stopVideo();
}

function nailed() {
  score++; streak++;
  document.getElementById('sc').textContent = score;
  document.getElementById('st').textContent = streak;
  document.getElementById('stIco').innerHTML =
    streak >= 5 ? '&#128293;&#128293;&#128293;' : streak >= 3 ? '&#128293;&#128293;' : '&#128293;';
  confetti();
  closeResult();
}

function nextSpin() {
  closeResult();
  setTimeout(spin, 350);
}

function confetti() {
  const box = document.getElementById('confettiBox');
  const cols = ['#FF6B00','#FFD700','#C8102E','#1D428A','#00E676','#FF4081','#fff'];
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-bit';
    el.style.left = Math.random() * 100 + '%';
    el.style.backgroundColor = cols[~~(Math.random() * cols.length)];
    el.style.animationDelay = Math.random() * 0.4 + 's';
    el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    const sz = 5 + Math.random() * 8;
    el.style.width = sz + 'px';
    el.style.height = sz + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    box.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}

document.getElementById('hubBtn').addEventListener('click', spin);
window.addEventListener('resize', resize);
resize();
</script>
