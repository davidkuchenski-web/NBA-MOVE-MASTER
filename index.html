function draw(){
const cx=cv.width/2,cy=cv.height/2,r=cx-4,sg=(2*Math.PI)/M.length;

M.forEach((_,i)=>{

});

}

function win(){const sg=(2*Math.PI)/M.length;let n=((-Math.PI/2-ang)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return Math.floor(n/sg)%M.length;}

function spin(){
if(busy)return;cls();busy=true;
document.getElementById(‘spn’).disabled=true;
const dur=4000+Math.random()*2500,rot=(8+Math.random()*7)*Math.PI*2,s=ang,t0=performance.now();
(function f(now){
const p=Math.min((now-t0)/dur,1);

else{busy=false;document.getElementById(‘spn’).disabled=false;show();}
})(t0);
}
