<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NBA Move Master</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bangers&display=swap');
:root{--o:#FF6B00;--dk:#0a0a14;--g:#FFD700;--r:#C8102E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--dk);color:#fff;font-family:'Oswald','Arial Black',sans-serif;overflow-x:hidden;min-height:100vh;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(170deg,#0d0d1a 0%,#1a0a00 30%,#0d0d1a 50%,#0a0014 70%,#0d0d1a 100%);background-attachment:fixed}
/* Court lines background texture */
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% 110%,rgba(255,107,0,.06),transparent),
  radial-gradient(ellipse 60% 40% at 50% -10%,rgba(200,16,46,.05),transparent),
  repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.012) 60px,rgba(255,255,255,.012) 61px),
  repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,255,255,.012) 60px,rgba(255,255,255,.012) 61px);
pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:50%;left:50%;width:200px;height:200px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.015);border-radius:50%;pointer-events:none;z-index:0}
.hd{text-align:center;padding:20px 16px 4px;position:relative;z-index:1}
.hd h1{font-family:'Bangers','Impact',sans-serif;font-size:clamp(2rem,8vw,3.5rem);letter-spacing:3px;color:var(--g);text-shadow:0 0 30px rgba(255,215,0,.3),0 2px 16px rgba(255,107,0,.5);line-height:1}
.hd .sb{font-size:clamp(.65rem,2.2vw,.9rem);color:rgba(255,255,255,.5);letter-spacing:5px;text-transform:uppercase;margin-top:4px;font-weight:500}
.gm{display:flex;flex-direction:column;align-items:center;padding:8px 16px 24px;position:relative;z-index:1}
.wz{position:relative;width:min(84vw,440px);aspect-ratio:1;margin:6px auto}
.gr{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,var(--o),var(--g),var(--o),var(--r),var(--o));opacity:.5;filter:blur(3px);animation:p 3s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:.6}}
.wb{position:absolute;inset:2px;border-radius:50%;background:#08080e;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
canvas{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%}
.pt{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:20;filter:drop-shadow(0 3px 6px rgba(255,215,0,.7))}
.hb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:clamp(52px,14vw,70px);height:clamp(52px,14vw,70px);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8c00,var(--r));border:3px solid var(--g);display:flex;align-items:center;justify-content:center;z-index:15;cursor:pointer;box-shadow:0 0 20px rgba(255,107,0,.6);transition:transform .15s}
.hb:active{transform:translate(-50%,-50%) scale(.92)}
.hb span{font-family:'Bangers','Impact',sans-serif;font-size:clamp(.65rem,2.2vw,.85rem);letter-spacing:2px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* Result panel - covers wheel area */
.rp{position:absolute;inset:-2px;z-index:30;display:none;flex-direction:column;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0d0d1a 0%,#111118 50%,#0d0d1a 100%);border:2px solid rgba(255,107,0,.3);box-shadow:0 0 60px rgba(255,107,0,.15),inset 0 1px 0 rgba(255,255,255,.05)}
.rp.on{display:flex;animation:pop .4s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.rt{text-align:center;padding:14px 12px 6px;flex-shrink:0;background:linear-gradient(180deg,rgba(255,107,0,.12),transparent)}
.rpl{font-family:'Bangers','Impact',sans-serif;font-size:clamp(1.4rem,5vw,2rem);color:var(--g);text-shadow:0 2px 10px rgba(255,107,0,.4);line-height:1.1}
.rpm{font-size:clamp(.7rem,2vw,.85rem);color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:3px;margin-top:3px}
.rpb{display:inline-block;margin-top:5px;padding:2px 10px;background:var(--r);border-radius:10px;font-family:'Bangers','Impact',sans-serif;font-size:.6rem;letter-spacing:2px;color:#fff}
/* Video area */
.vb{flex:1;min-height:0;margin:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.vb iframe{width:100%;flex:1;min-height:180px;max-height:300px;border:none;border-radius:8px;background:#000}
.tk-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#000;border:2px solid #fe2c55;border-radius:30px;color:#fff;text-decoration:none;font-family:'Bangers','Impact',sans-serif;font-size:clamp(1rem,3vw,1.2rem);letter-spacing:2px;transition:all .2s;box-shadow:0 0 20px rgba(254,44,85,.2)}
.tk-btn:hover,.tk-btn:active{transform:scale(.97);background:#1a1a1a;border-color:#ff3b5c}
.tk-logo{display:flex;align-items:center;gap:4px}
.tk-logo svg{width:22px;height:22px}
.tk-note{font-size:clamp(.5rem,1.4vw,.65rem);color:rgba(255,255,255,.25);margin-top:0}
/* Bottom section */
.rb{flex-shrink:0;padding:6px 10px 12px;text-align:center}
.rd{font-size:clamp(.7rem,1.8vw,.85rem);color:rgba(255,255,255,.6);line-height:1.4;margin-bottom:5px}
.rs{font-size:.8rem;color:rgba(255,255,255,.35);margin-bottom:6px}
.rs .on{color:var(--g)}
.rbs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.rbs button{padding:7px 16px;font-family:'Bangers','Impact',sans-serif;font-size:clamp(.8rem,2.4vw,.95rem);letter-spacing:1.5px;border:none;border-radius:18px;cursor:pointer;transition:transform .1s}
.rbs button:active{transform:scale(.95)}
.bn{color:#111;background:linear-gradient(135deg,#00E676,#00C853)}
.bb{color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)!important}
.bx{color:#111;background:linear-gradient(135deg,var(--g),var(--o))}
/* Spin button + score */
.sp{margin-top:16px;padding:14px 50px;font-family:'Bangers','Impact',sans-serif;font-size:clamp(1.3rem,4.5vw,1.7rem);letter-spacing:4px;color:#111;background:linear-gradient(135deg,var(--g),var(--o));border:none;border-radius:36px;cursor:pointer;box-shadow:0 4px 25px rgba(255,107,0,.4),0 0 60px rgba(255,215,0,.1);transition:transform .15s}
.sp:active{transform:scale(.96)}
.sp:disabled{opacity:.4;pointer-events:none}
.sc{display:flex;gap:20px;margin-top:14px;padding:8px 24px;background:rgba(255,255,255,.07);border-radius:24px;border:1px solid rgba(255,215,0,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.st{display:flex;align-items:center;gap:6px}
.st .l{font-size:.65rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:2px;font-weight:700}
.st .n{font-family:'Bangers','Impact',sans-serif;font-size:1.4rem;color:var(--g);text-shadow:0 0 10px rgba(255,215,0,.3)}
.st .i{font-size:1.1rem}
/* Confetti */
.cb{position:fixed;inset:0;pointer-events:none;z-index:200}
.cf{position:absolute;top:-10px;animation:fl 2.5s ease-in forwards}
@keyframes fl{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:400px){.wz{width:92vw}.rbs button{padding:6px 12px;font-size:.78rem}.tk-btn{padding:10px 18px;font-size:.9rem}}
</style>
</head>

const C=[’#C8102E’,’#1D428A’,’#552583’,’#007A33’,’#CE1141’,’#006BB6’,’#F58426’,’#860038’,’#E56020’,’#00471B’,’#1D1160’,’#236192’,’#EF3B24’,’#002D62’,’#FFC72C’,’#00788C’,’#E31837’,’#002B5C’,’#F9A01B’,’#5D76A9’,’#C8102E’,’#1D428A’,’#552583’,’#007A33’,’#CE1141’,’#006BB6’,’#F58426’,’#860038’,’#E56020’,’#00471B’,’#1D1160’,’#236192’,’#EF3B24’,’#002D62’,’#FFC72C’,’#00788C’,’#E31837’,’#002B5C’,’#F9A01B’,’#5D76A9’,’#C8102E’,’#1D428A’,’#552583’,’#007A33’,’#CE1141’,’#006BB6’,’#F58426’,’#860038’,’#E56020’,’#00471B’];

const cv=document.getElementById(‘c’),x=cv.getContext(‘2d’);
let ang=0,busy=false,sc=0,sk=0;

function sz(){
const w=document.getElementById(‘wz’).clientWidth-8;
cv.width=w*2;cv.height=w*2;
cv.style.width=w+‘px’;cv.style.height=w+‘px’;
draw();
}

function draw(){
const cx=cv.width/2,cy=cv.height/2,r=cx-4,sg=(2*Math.PI)/M.length;
x.clearRect(0,0,cv.width,cv.height);
M.forEach((_,i)=>{
const a1=ang+i*sg,a2=a1+sg;
x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,a1,a2);x.closePath();
x.fillStyle=C[i%C.length];x.fill();
x.strokeStyle=‘rgba(0,0,0,.3)’;x.lineWidth=1;x.stroke();
// Draw player name on segment
x.save();x.translate(cx,cy);x.rotate(a1+sg/2);
x.textAlign=‘right’;x.textBaseline=‘middle’;
const fs=Math.max(10,Math.min(15,r*.042));
x.font=`700 ${fs}px 'Oswald','Arial Black',sans-serif`;
const nm=M[i].ln,tx=r-10;
x.strokeStyle=‘rgba(0,0,0,.85)’;x.lineWidth=3;x.lineJoin=‘round’;x.strokeText(nm,tx,0);
x.fillStyle=’#fff’;x.fillText(nm,tx,0);
x.restore();
});
// Center circle overlay
x.beginPath();x.arc(cx,cy,36,0,2*Math.PI);x.fillStyle=‘rgba(0,0,0,.5)’;x.fill();
}

function win(){
const sg=(2*Math.PI)/M.length;
let n=((-Math.PI/2-ang)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
return Math.floor(n/sg)%M.length;
}

function spin(){
if(busy)return;cls();busy=true;
document.getElementById(‘spn’).disabled=true;
const dur=4000+Math.random()*2500,rot=(8+Math.random()*7)*Math.PI*2,s=ang,t0=performance.now();
(function f(now){
const p=Math.min((now-t0)/dur,1);
ang=s+rot*(1-Math.pow(1-p,4));draw();
if(p<1)requestAnimationFrame(f);
else{busy=false;document.getElementById(‘spn’).disabled=false;show();}
})(t0);
}

function show(){
const mv=M[win()];
document.getElementById(‘rpP’).textContent=mv.p;
document.getElementById(‘rpM’).textContent=mv.m;
document.getElementById(‘rpD’).textContent=mv.d;
const on=’\u2605’,off=’\u2606’;
document.getElementById(‘rpS’).innerHTML=‘Difficulty: <span class="on">’+on.repeat(mv.s)+’</span>’+off.repeat(5-mv.s);

const va=document.getElementById(‘vidArea’);
va.innerHTML=’’;

// If we have a TikTok video ID, embed it
if(mv.tk){
const iframe=document.createElement(‘iframe’);

function cls(){
document.getElementById(‘rp’).classList.remove(‘on’);
// Clean up iframes
const va=document.getElementById(‘vidArea’);
const iframes=va.querySelectorAll(‘iframe’);
iframes.forEach(f=>f.src=‘about:blank’);
setTimeout(()=>va.innerHTML=’’,100);
}

function nail(){
sc++;sk++;
document.getElementById(‘scN’).textContent=sc;
document.getElementById(‘skN’).textContent=sk;
document.getElementById(‘skI’).innerHTML=sk>=5?’🔥🔥🔥’:sk>=3?’🔥🔥’:’🔥’;
boom();cls();
}

function nxt(){cls();setTimeout(spin,350);}

function boom(){
const b=document.getElementById(‘cb’);
const cc=[’#FF6B00’,’#FFD700’,’#C8102E’,’#1D428A’,’#00E676’,’#FF4081’,’#fff’];
for(let i=0;i<45;i++){
const e=document.createElement(‘div’);e.className=‘cf’;
e.style.left=Math.random()*100+’%’;
e.style.backgroundColor=cc[~~(Math.random()*cc.length)];
e.style.animationDelay=Math.random()*.4+‘s’;
e.style.animationDuration=(2+Math.random()*1.5)+‘s’;
const z=5+Math.random()*7;
e.style.width=z+‘px’;e.style.height=z+‘px’;
e.style.borderRadius=Math.random()>.5?‘50%’:‘2px’;
b.appendChild(e);setTimeout(()=>e.remove(),3000);
}
}

document.getElementById(‘hub’).onclick=spin;
window.addEventListener(‘resize’,sz);
